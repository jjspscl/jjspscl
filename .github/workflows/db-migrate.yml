name: D1 Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/db/**'
      - 'frontend/wrangler.jsonc'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  migrate:
    runs-on: ubuntu-latest
    name: Run D1 Migrations
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Migrations
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        run: |
          if [ "$TARGET_ENVIRONMENT" = "preview" ]; then
            DATABASE_NAME="jjspscl-preview"
          elif [ "$TARGET_ENVIRONMENT" = "production" ]; then
            DATABASE_NAME="jjspscl"
          else
            echo "Unsupported migration environment: $TARGET_ENVIRONMENT"
            exit 1
          fi

          echo "Applying tracked migrations to $TARGET_ENVIRONMENT..."
          npx wrangler d1 migrations apply "$DATABASE_NAME" --remote

      - name: Verify Tables
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
        run: |
          if [ "$TARGET_ENVIRONMENT" = "preview" ]; then
            DATABASE_NAME="jjspscl-preview"
          else
            DATABASE_NAME="jjspscl"
          fi
          echo "Verifying tables..."
          npx wrangler d1 execute "$DATABASE_NAME" --remote --command="SELECT name FROM sqlite_master WHERE type='table';"
